<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Users</title>
        <link href="/static/vendor/bootstrap.min.css" rel="stylesheet" />
        <script src="/static/common.js"></script>
        <style>
            user-list-table {
                display: block;
            }
            user-list-table table {
                width: 100%;
                border-collapse: collapse;
            }
            user-list-table th,
            user-list-table td {
                padding: 8px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            user-list-table th {
                background-color: #f8f9fa;
                font-weight: bold;
            }
            user-list-table button {
                padding: 4px 12px;
                cursor: pointer;
            }
            #messages {
                margin-top: 20px;
                padding: 10px;
                border-radius: 4px;
            }
            #messages.success {
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }
            #messages.error {
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }
        </style>
    </head>
    <body>
        {{ template "menu.html" . }}

        <div class="jumbotron">
            <h2>User Management</h2>
            <user-list-table api-url="{{getAPIBaseURL}}"></user-list-table>
        </div>

        <div id="messages"></div>

        <script>
            class UserListTable extends HTMLElement {
                constructor() {
                    super();
                    this.users = [];
                    this.isLoading = false;
                    this.apiUrl = '';
                    this.pollInterval = null;
                }

                connectedCallback() {
                    this.apiUrl = this.getAttribute('api-url') || '';
                    this.render();
                    this.fetchUsers();

                    // Poll for updates every 5 seconds
                    this.pollInterval = setInterval(() => {
                        this.fetchUsers();
                    }, 5000);
                }

                disconnectedCallback() {
                    if (this.pollInterval) {
                        clearInterval(this.pollInterval);
                    }
                }

                async fetchUsers() {
                    try {
                        this.isLoading = true;
                        const response = await fetch(`${this.apiUrl}/auth/users`);

                        if (response.status === 401) {
                            document.location = `${this.apiUrl}/login.html?from=users.html`;
                            return;
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        this.users = await response.json();
                        this.isLoading = false;
                        this.render();
                    } catch (error) {
                        console.error('Error fetching users:', error);
                        this.showMessage(`Error loading users: ${error.message}`, 'error');
                        this.isLoading = false;
                    }
                }

                async updateUser(user) {
                    try {
                        const data = {
                            active: user.Active,
                            roles: user.Roles
                        };

                        const response = await putJson(
                            `${this.apiUrl}/auth/users/${user.UID}`,
                            JSON.stringify(data)
                        );

                        if (response.status === "success") {
                            this.showMessage(`Successfully updated ${user.Name}`, 'success');
                        } else {
                            this.showMessage(`Failed to update ${user.Name}`, 'error');
                        }
                    } catch (error) {
                        console.error('Error updating user:', error);
                        this.showMessage(`Error updating ${user.Name}: ${error.message}`, 'error');
                    }
                }

                handleCheckboxChange(userId, field, value) {
                    const user = this.users.find(u => u.UID === userId);
                    if (!user) return;

                    if (field === 'Active') {
                        user.Active = value;
                    } else {
                        // Handle role checkboxes
                        if (!Array.isArray(user.Roles)) {
                            user.Roles = [];
                        }

                        if (value) {
                            // Add role if checked and not already present
                            if (!user.Roles.includes(field)) {
                                user.Roles.push(field);
                            }
                        } else {
                            // Remove role if unchecked
                            user.Roles = user.Roles.filter(r => r !== field);
                        }
                    }
                }

                showMessage(message, type) {
                    const messagesDiv = document.getElementById('messages');
                    if (messagesDiv) {
                        messagesDiv.innerText = message;
                        messagesDiv.className = type;

                        // Clear message after 5 seconds
                        setTimeout(() => {
                            messagesDiv.innerText = '';
                            messagesDiv.className = '';
                        }, 5000);
                    }
                }

                render() {
                    this.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Active</th>
                                    <th>Admin</th>
                                    <th>Update</th>
                                    <th>Viewer</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${this.users.length === 0 && !this.isLoading
                                    ? '<tr><td colspan="6">No users found</td></tr>'
                                    : this.users.map(user => this.renderUserRow(user)).join('')
                                }
                                ${this.isLoading
                                    ? '<tr><td colspan="6">Loading...</td></tr>'
                                    : ''
                                }
                            </tbody>
                        </table>
                    `;

                    // Attach event listeners
                    this.attachEventListeners();
                }

                renderUserRow(user) {
                    const roles = Array.isArray(user.Roles) ? user.Roles : [];

                    return `
                        <tr data-user-id="${user.UID}">
                            <td>${this.escapeHtml(user.Name)}</td>
                            <td>
                                <input
                                    type="checkbox"
                                    class="user-checkbox"
                                    data-field="Active"
                                    ${user.Active ? 'checked' : ''}
                                />
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    class="user-checkbox"
                                    data-field="admin"
                                    ${roles.includes('admin') ? 'checked' : ''}
                                />
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    class="user-checkbox"
                                    data-field="update"
                                    ${roles.includes('update') ? 'checked' : ''}
                                />
                            </td>
                            <td>
                                <input
                                    type="checkbox"
                                    class="user-checkbox"
                                    data-field="view"
                                    ${roles.includes('view') ? 'checked' : ''}
                                />
                            </td>
                            <td>
                                <button class="update-user-btn">Update User</button>
                            </td>
                        </tr>
                    `;
                }

                attachEventListeners() {
                    // Attach checkbox change listeners
                    this.querySelectorAll('.user-checkbox').forEach(checkbox => {
                        checkbox.addEventListener('change', (e) => {
                            const row = e.target.closest('tr');
                            const userId = row.dataset.userId;
                            const field = e.target.dataset.field;
                            const value = e.target.checked;

                            this.handleCheckboxChange(userId, field, value);
                        });
                    });

                    // Attach update button listeners
                    this.querySelectorAll('.update-user-btn').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const row = e.target.closest('tr');
                            const userId = row.dataset.userId;
                            const user = this.users.find(u => u.UID === userId);

                            if (user) {
                                this.updateUser(user);
                            }
                        });
                    });
                }

                escapeHtml(text) {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                }
            }

            // Register the custom element
            customElements.define('user-list-table', UserListTable);
        </script>
    </body>
</html>
