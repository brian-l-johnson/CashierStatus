<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>QRCode Tester</title>
        <script type="text/javascript" src="/static/vendor/qrcode-generator.js"></script>
        <script type="text/javascript" src="/static/qr-canvas.js"></script>
        <link href="static/vendor/bootstrap.min.css" rel="stylesheet" />
        <script>
            async function generateCode() {
                clearQRCode();
                const station = document.forms.qrdata['station'].value;
                const resp = await fetch('/auth/sign-control', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({control: 'setup-station', station: station}),
                });
                if (!resp.ok) {
                    const body = await resp.json().catch(() => ({}));
                    document.getElementById("datajson").innerText =
                        "Error: " + (body.message || resp.status);
                    return;
                }
                const data = await resp.json();
                new QRCode(document.getElementById("qrcode"), data.qr);
                document.getElementById("datajson").innerText =
                    data.payload + " (expires " + new Date(data.exp * 1000).toLocaleString() + ")";
            }

            function clearQRCode() {
                document.getElementById("qrcode").innerHTML = "";
            }
        </script>

    </head>
    <body>
        {{ template "menu.html" . }}
        <div class="container-fluid">
            <form onsubmit="return false;" name="qrdata">
                <div class="form-group">
                    <label for="orderid">Cashier Station</label>
                    <input type="text" class="form-control" name="station" id="station" placeholder="enter order station id">
                </div>
                <button class="btn btn-primary" onclick="generateCode()">Generate</button>
            </form>
            <div class="container" id="qrcode"></div>
            <div class="container" id="datajson"></div>
        </div>
    </body>
</html>
