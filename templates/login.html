<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Login</title>
        <link href="static/vendor/bootstrap.min.css" rel="stylesheet" />
        <script src="static/common.js"></script>
        <style>
            body {
                display: flex;
                align-items: center;
                min-height: 100vh;
                background-color: #f5f5f5;
            }
            .form-signin {
                max-width: 350px;
                padding: 1rem;
            }
            .form-signin .form-floating:first-of-type input {
                border-bottom-right-radius: 0;
                border-bottom-left-radius: 0;
            }
            .form-signin .form-floating:last-of-type input {
                margin-top: -1px;
                border-top-left-radius: 0;
                border-top-right-radius: 0;
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body class="container-fluid">
        <main class="form-signin w-100 m-auto">
            <form id="loginform" action="" name="login" onsubmit="doLogin(event)">
                <h1 class ="h4 mb-3 fw-normal">Please Sign in</h1>
                <div style="display:none; color:red" id="loginerr">
                    <h3 class="h3 mb-3 fw-normal">Invalid username or password</h3>
                </div>
                <div class="form-floating">
                    <input type="text" name="user" class="form-control" id="floatingInput" placeholder="username">
                    <label for="floatingInput">User name</label>
                </div>
                <div class="form-floating">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Password</label>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Sign In</button>
            </form>
            <div class="container">
                <a href="/register">Register</a>
            </div>
            <script>

                function getRedirectTarget() {
                    const from = new URLSearchParams(window.location.search).get("from");
                    // Only follow same-origin relative paths, never an absolute/protocol-relative URL.
                    if (from && from.startsWith("/") && !from.startsWith("//")) {
                        return from;
                    }
                    return "{{getAPIBaseURL}}/";
                }

                async function doLogin(event) {
                    event.preventDefault();
                    const formData = new FormData(document.login);
                    const responseData = await postFormDataAsJson("{{getAPIBaseURL}}/auth/login", formData);
                    if(responseData.message == "login success") {
                        document.location = getRedirectTarget();
                    }
                    else {
                        document.getElementById("loginerr").style.display = "block"
                    }
                }
            </script>
        </main>
    </body>
</html>
